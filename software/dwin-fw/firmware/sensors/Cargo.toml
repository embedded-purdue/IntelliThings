[package]
name         = "sensors"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
description  = "IntelliThings node sensors: SHT41, SGP40 (with Sensirion's VOC index), SCD41, BH1750 and VL53L0X on embedded-hal-async, and the once-a-second readout"
license      = "MIT AND BSD-3-Clause"

[dependencies]
embedded-hal-async = "1.0"
libm               = "0.2"

[dev-dependencies]
embassy-futures = "0.1"
